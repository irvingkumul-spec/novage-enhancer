<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NOVAGE AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: #ffffff;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 28px 16px;
    }

    .app {
      width: 100%;
      max-width: 950px;
      height: calc(100vh - 56px);
      min-height: 600px;
      display: flex;
      flex-direction: column;
      background: #111111;
      border: 1px solid #292929;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
    }

    .header {
      padding: 20px 22px;
      border-bottom: 1px solid #292929;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: rgba(17, 17, 17, 0.96);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: #e3fc02;
      color: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 19px;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .brand-text p {
      margin: 4px 0 0;
      font-size: 12px;
      color: #929292;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #ababab;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e3fc02;
      box-shadow: 0 0 10px rgba(227, 252, 2, 0.45);
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 26px;
      scroll-behavior: smooth;
    }

    .welcome {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome-inner {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    .welcome-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e3fc02;
      color: #080808;
      font-size: 30px;
      font-weight: 900;
    }

    .welcome h2 {
      margin: 0;
      font-size: clamp(25px, 4vw, 38px);
      letter-spacing: -1.2px;
    }

    .welcome p {
      margin: 13px auto 24px;
      max-width: 540px;
      color: #999999;
      font-size: 14px;
      line-height: 1.6;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .suggestion {
      border: 1px solid #303030;
      background: #171717;
      color: #d6d6d6;
      padding: 14px;
      border-radius: 13px;
      cursor: pointer;
      text-align: left;
      font-size: 13px;
      transition: 0.2s ease;
    }

    .suggestion:hover {
      border-color: #e3fc02;
      color: #ffffff;
      transform: translateY(-1px);
    }

    .message-row {
      width: 100%;
      display: flex;
      margin-bottom: 18px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.ai {
      justify-content: flex-start;
    }

    .message {
      max-width: min(75%, 680px);
      padding: 13px 16px;
      border-radius: 17px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      background: #e3fc02;
      color: #090909;
      border-bottom-right-radius: 5px;
      font-weight: 500;
    }

    .message.ai {
      background: #1b1b1b;
      color: #ededed;
      border: 1px solid #2b2b2b;
      border-bottom-left-radius: 5px;
    }

    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
      height: 22px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e3fc02;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.35;
      }

      40% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    .composer-area {
      padding: 15px;
      border-top: 1px solid #292929;
      background: #111111;
    }

    .composer {
      width: 100%;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 8px;
      background: #191919;
      border: 1px solid #303030;
      border-radius: 17px;
      transition: border-color 0.2s ease;
    }

    .composer:focus-within {
      border-color: #626d03;
    }

    textarea {
      flex: 1;
      min-height: 46px;
      max-height: 150px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 12px 10px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.45;
    }

    textarea::placeholder {
      color: #717171;
    }

    .send {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border: 0;
      border-radius: 13px;
      background: #e3fc02;
      color: #080808;
      cursor: pointer;
      font-size: 20px;
      font-weight: 900;
      transition: 0.15s ease;
    }

    .send:hover {
      transform: scale(1.04);
    }

    .send:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    .footer-text {
      text-align: center;
      color: #646464;
      font-size: 10px;
      padding-top: 8px;
    }

    @media (max-width: 700px) {
      body {
        padding: 0;
      }

      .app {
        height: 100vh;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
      }

      .header {
        padding: 15px;
      }

      .status {
        display: none;
      }

      .chat {
        padding: 18px 14px;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .message {
        max-width: 88%;
      }

      .composer-area {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">
      <div class="brand">
        <div class="logo">N</div>

        <div class="brand-text">
          <h1>NOVAGE AI</h1>
          <p>Asistente especializado en DTF</p>
        </div>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        Disponible
      </div>
    </header>

    <section class="chat" id="chat">

      <div class="welcome" id="welcome">

        <div class="welcome-inner">

          <div class="welcome-icon">✦</div>

          <h2>¿En qué puedo ayudarte?</h2>

          <p>
            Pregúntame sobre DTF, preparación de diseños,
            semitonos, vectorización, calidad de imágenes
            y herramientas de NOVAGE.
          </p>

          <div class="suggestions">

            <button
              class="suggestion"
              data-message="¿Cómo sé si mi diseño tiene suficiente calidad para imprimir en DTF?"
            >
              ¿Mi diseño tiene buena calidad para DTF?
            </button>

            <button
              class="suggestion"
              data-message="¿Cuándo debería vectorizar un diseño?"
            >
              ¿Cuándo debería vectorizar?
            </button>

            <button
              class="suggestion"
              data-message="¿Cuándo conviene utilizar semitonos en un diseño DTF?"
            >
              ¿Cuándo utilizar semitonos?
            </button>

            <button
              class="suggestion"
              data-message="¿Qué debo revisar antes de mandar un diseño a imprimir en DTF?"
            >
              Preparar un diseño para impresión
            </button>

          </div>

        </div>

      </div>

    </section>

    <div class="composer-area">

      <div class="composer">

        <textarea
          id="input"
          rows="1"
          placeholder="Pregúntale algo a NOVAGE AI..."
        ></textarea>

        <button
          class="send"
          id="send"
          aria-label="Enviar mensaje"
        >
          ↑
        </button>

      </div>

      <div class="footer-text">
        NOVAGE AI puede cometer errores. Verifica información importante.
      </div>

    </div>

  </main>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendButton = document.getElementById("send");
    const welcome = document.getElementById("welcome");

    let enviando = false;

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function ocultarBienvenida() {
      if (welcome) {
        welcome.remove();
      }
    }

    function agregarMensaje(tipo, texto) {
      ocultarBienvenida();

      const row = document.createElement("div");
      row.className = `message-row ${tipo}`;

      const bubble = document.createElement("div");
      bubble.className = `message ${tipo}`;

      if (tipo === "ai") {
        bubble.innerHTML = formatearRespuesta(texto);
      } else {
        bubble.textContent = texto;
      }

      row.appendChild(bubble);
      chat.appendChild(row);

      chat.scrollTop = chat.scrollHeight;

      return row;
    }

    function formatearRespuesta(texto) {
      let seguro = escapeHTML(texto);

      seguro = seguro.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
      );

      seguro = seguro.replace(/\n/g, "<br>");

      return seguro;
    }

    function agregarTyping() {
      ocultarBienvenida();

      const row = document.createElement("div");
      row.className = "message-row ai";
      row.id = "typing";

      row.innerHTML = `
        <div class="message ai">
          <div class="typing">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      `;

      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    function quitarTyping() {
      document.getElementById("typing")?.remove();
    }

    async function enviarMensaje(mensajeManual = null) {
      if (enviando) return;

      const mensaje = (
        mensajeManual !== null
          ? mensajeManual
          : input.value
      ).trim();

      if (!mensaje) return;

      enviando = true;
      sendButton.disabled = true;

      agregarMensaje("user", mensaje);

      input.value = "";
      ajustarTextarea();

      agregarTyping();

      try {
        const response = await fetch("/api/novage-ai", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            mensaje
          })
        });

        const data = await response.json();

        quitarTyping();

        if (!response.ok) {
          throw new Error(
            data.details ||
            data.error ||
            "No se pudo obtener una respuesta."
          );
        }

        agregarMensaje(
          "ai",
          data.respuesta || "No pude generar una respuesta."
        );

      } catch (error) {
        quitarTyping();

        agregarMensaje(
          "ai",
          "Ocurrió un error al conectar con NOVAGE AI. Intenta nuevamente."
        );

        console.error(error);

      } finally {
        enviando = false;
        sendButton.disabled = false;
        input.focus();
      }
    }

    function ajustarTextarea() {
      input.style.height = "auto";

      input.style.height =
        Math.min(input.scrollHeight, 150) + "px";
    }

    input.addEventListener("input", ajustarTextarea);

    input.addEventListener("keydown", (event) => {
      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();
        enviarMensaje();
      }
    });

    sendButton.addEventListener("click", () => {
      enviarMensaje();
    });

    document
      .querySelectorAll(".suggestion")
      .forEach((button) => {
        button.addEventListener("click", () => {
          enviarMensaje(button.dataset.message);
        });
      });

  </script>

</body>
</html>
